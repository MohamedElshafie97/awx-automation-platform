# Receptor inside awx-task. Single local node: AWX submits work over the
# control socket and receptor runs ansible-runner, which starts the
# execution-environment container with podman.
---
- node:
    id: awx-task

- log-level: info

- local-only: null

- control-service:
    service: control
    filename: /var/run/receptor/receptor.sock
    permissions: "0660"

- work-command:
    worktype: local
    command: ansible-runner
    params: worker
    allowruntimeparams: true
