# Receptor in the awx-ee container. Single local node named after the AWX
# instance (awx-task): AWX submits work over the shared control socket and
# receptor runs ansible-runner, which starts the job's EE container with podman.
---
- node:
    id: awx-task

- log-level: info

- local-only: null

- control-service:
    service: control
    filename: /var/run/receptor/receptor.sock
    permissions: "0666"

- work-command:
    worktype: local
    command: ansible-runner
    params: worker
    allowruntimeparams: true
